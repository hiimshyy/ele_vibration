[project]
name = "vibration"
version = "0.1.0"
description = "Thu thập & giám sát rung ES-VS-01 và cắt dữ liệu theo phiên chạy thang máy (iot_core / Modbus RTU)."
readme = "elevator-session-vibration-plan.md"
requires-python = ">=3.9"
# Toàn bộ chương trình chỉ dùng thư viện chuẩn của Python — không có dependency ngoài.
dependencies = []

[project.scripts]
# Chạy qua: uv run <tên lệnh> [tham số]
es-vs-01 = "es_vs_01:main"                        # đọc cảm biến trực tiếp qua Modbus RTU
es-vs-01-ws = "es_vs_01_ws:main"                  # nhận rung qua Socket.IO iot_core
elevator-logger = "elevator_session_logger:main"  # cắt rung theo phiên chạy thang máy

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Layout phẳng: các module nằm ngay ở thư mục gốc.
include = [
    "es_vs_01.py",
    "es_vs_01_ws.py",
    "socketio_client.py",
    "elevator_session_logger.py",
]

[tool.uv]
# Ưu tiên dùng Python hệ thống trên Orange Pi, không tải bản managed.
python-preference = "system"
